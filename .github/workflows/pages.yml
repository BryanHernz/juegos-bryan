name: Validar portal
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas
        run: npm ci
      - name: Pruebas del portal
        run: npm test
      - name: Validar JavaScript
        run: npm run check
      - name: Preparar sitio estático
        run: npm run build
