<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#071018">
<meta name="robots" content="noindex">
<title>Descargar aplicación · Nexo</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=private-v1">
</head>
<body>
<main class="portal-login" aria-labelledby="download-title">
  <section class="portal-login-card" id="download-card" data-state="restoring">
    <a class="brand" href="/" aria-label="Nexo, volver al portal"><img class="brand-icon" src="/assets/nexo-mark.svg" alt="">Nexo</a>
    <h1 id="download-title">Descargar aplicación</h1>
    <p id="download-message" role="status" aria-live="polite">Verificando sesión…</p>
    <form id="download-login" hidden>
      <label>Correo<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Iniciar sesión</button>
    </form>
    <button class="button primary" id="download-retry" type="button" hidden>Reintentar</button>
    <button class="button" id="download-logout" type="button" hidden>Cerrar sesión</button>
    <p><a href="/">Volver al portal</a></p>
    <noscript>Activa JavaScript para iniciar sesión y descargar. Este enlace requiere una cuenta Nexo autorizada.</noscript>
  </section>
</main>
<script type="module" src="/download-page.mjs"></script>
</body>
</html>
